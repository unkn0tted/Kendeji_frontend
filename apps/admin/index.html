<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <!-- PWA -->
    <link rel="manifest" href="/site.webmanifest">
    <meta
      name="theme-color"
      content="#fff5f9"
      media="(prefers-color-scheme: light)"
    >
    <meta
      name="theme-color"
      content="#140b11"
      media="(prefers-color-scheme: dark)"
    >

    <!-- SEO -->
    <meta name="description" content="Kendeji Admin — management console.">
    <meta name="keywords" content="">

    <title>Kendeji Admin</title>
  </head>
  <body>
    <div id="app">
      <!-- Boot splash: replaced by React on mount -->
      <style>
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff5f9;
      }
      #app .boot-spin {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 3px solid rgba(219, 39, 119, 0.2);
        border-top-color: #db2777;
        animation: bootspin 0.7s linear infinite;
      }
      @keyframes bootspin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        #app {
          background: #140b11;
        }
        #app .boot-spin {
          border-color: rgba(244, 114, 182, 0.2);
          border-top-color: #f472b6;
        }
      }
      </style>
      <div class="boot-spin" role="status" aria-label="Loading"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
